<script>
(() => {
  const root = document.getElementById("lb-records");
  const page = root.querySelector("#lb-page");
  const ages = ["U-12", "U-10"];
  const cups = JSON.parse(document.getElementById("lb-records-data").textContent);

      const key = cup.teamKeys?.[team.id] || cup.tournament.id + "/" + team.id;
      const games = team.matchIds.map(id => cup.matchesById.get(id)).sort((a,b) => (b.result.date || b.scheduledDate || "").localeCompare(a.result.date || a.scheduledDate || ""));
      const bestStage = stageRank.find(stage => games.some(game => game.stage === stage)) || games[0]?.stage || "참가";
      team.entry = { key, cup, team, games, placement: cup.placements?.[team.id] || bestStage };
      if (!teamIndex.has(key)) teamIndex.set(key, { key, name: team.name, names: new Set(), entries: [], scheduledEntries: [] });

      club.names.add(team.name);
      club.entries.push(team.entry);

    for (const team of cup.teams) {
      const key = cup.teamKeys[team.id];

      const club = teamIndex.get(key);
      club.names.add(team.name);
      club.scheduledEntries.push({key,cup,team,games:cup.matches.filter(match => match.eligibleTeamIds.includes(team.id))});
    }
  }
  for (const club of teamIndex.values()) {

      club.name = displayTeamNames[club.key];
      club.names.add(club.name);

    club.scheduledEntries.sort((a,b) => a.cup.tournament.startDate.localeCompare(b.cup.tournament.startDate));

  function scheduledGame(entry,match) {

      const ordered = [...opponent].sort((a,b) =>
        Number(cup.teamKeys[b] === favoriteTeamKey) - Number(cup.teamKeys[a] === favoriteTeamKey) || nameFor(cup,a).localeCompare(nameFor(cup,b),"ko"));

  function scheduledRecords(entries) {
    const section = el("section",undefined,"lb-team-schedule");

    const byTime = (a,b) => a.scheduledDate.localeCompare(b.scheduledDate) || a.scheduledTime.localeCompare(b.scheduledTime);
    const cards = [];
    for (const entry of entries) {
      const {tournament} = entry.cup;
      const matches = [...entry.games].sort(byTime);
      if (!matches.length) continue;
      const direct = matches.filter(match => match.sides.some(side => side.team === entry.team.id));
      const followups = matches.filter(match => !direct.includes(match));
      const card = el("article",undefined,"lb-schedule-cup");
      const title = el("div",undefined,"lb-line");
      title.append(el("h4",tournament.name),el("span",tournament.ageGroup,"lb-chip"));
      card.append(title);
      const games = el("ol",undefined,"lb-schedule-games");
      games.append(...direct.map(match => scheduledGame(entry,match)));
      card.append(games);
      if (followups.length) {
        const panel = el("details",undefined,"lb-schedule-followups");
        const later = el("ol",undefined,"lb-schedule-games");
        later.append(...followups.map(match => scheduledGame(entry,match)));
        panel.append(el("summary","진출 시 일정 보기 (" + followups.length + "경기)"),later);
        card.append(panel);
      }
      cards.push({card,age:tournament.ageGroup,first:direct[0] || matches[0]});
    }
    if (!cards.length) {
      section.append(el("p","등록된 대회 일정이 아직 없습니다.","lb-muted"));
      return section;
    }
    const list = el("div",undefined,"lb-stack");
    if (cards.length > 1) {
      const label = el("label","일정 정렬 ","lb-label");

      label.append(picker);

    section.append(list);

    function showOrder() {

      list.append(...ordered.map(item => item.card));

  function outcomeBadge(result, index) {
    let label, style;
    if (result.scores) {
      const difference = result.scores[index] - result.scores[1-index];
      label = difference > 0 ? "승" : difference < 0 ? "패" : "무";
      style = difference > 0 ? "win" : difference < 0 ? "loss" : "draw";
    } else {
      const advanced = result.advanced || result.winner;
      if (!advanced) return null;
      const won = result.teams[index] === advanced;
      if (result.method === "부전승") label = won ? "부전승" : "부전패";
      else if (result.method === "기권승") label = won ? "기권승" : "기권패";
      else label = won ? "추첨 진출" : "추첨 탈락";
      style = won ? "win" : "loss";
    }
    return el("span",label,"lb-outcome lb-outcome-" + style);
  }

  function resultRow(cup, match, focus) {
    const result = match.result;
    const order = focus ? [result.teams.indexOf(focus),result.teams.findIndex(id => id !== focus)] : [0,1];
    const names = order.map(i => nameFor(cup,result.teams[i]));
    const resultText = result.scores ? order.map(i => result.scores[i]).join("–") : "점수 없음";
    const advancingTeam = result.advanced || result.winner;
    const advance = result.method === "진출 불일치" ?
      " · 다음 라운드 출전팀 " + nameFor(cup,advancingTeam) + " (진출 경위 미확인)" :
      advancingTeam && result.method !== "점수" ?
      " · " + nameFor(cup,advancingTeam) + " " + result.method + (result.advanced ? " 진출" : "") :
      result.method === "무승부" ? " · 무승부" : "";
    const row = el("div",undefined,"lb-result");
    const dateLabel = result.date ? shortDate(result.date) : match.scheduledDate ? "예정 " + shortDate(match.scheduledDate) : "날짜 미확인";
    const provenance = result.decisionSource === "user" ? " (사용자 지정)" : "";
    const sourceName = result.sourceTeamName && !names.some(name => name.replace(/\s/g,"") === result.sourceTeamName.replace(/\s/g,"")) ?
      " · 결과지 표기 " + result.sourceTeamName : "";
    const matchup = el("span",undefined,"lb-matchup");
    const score = el("div",undefined,"lb-score");
    if (focus) {
      matchup.append(el("span","vs " + names[1]));
      const badge = outcomeBadge(result,order[0]);
      if (badge) score.append(badge);
    } else {
      for (const index of [0,1]) {
        if (index) matchup.append(el("span","vs","lb-muted"));

        const badge = outcomeBadge(result,index);
        if (badge) matchup.append(badge);

    score.append(el("strong",resultText));
    row.append(matchup,score,el("small",dateLabel + " · " + (match.group ? match.group + "조 " : "") + match.stage + advance + provenance + sourceName,"lb-muted"));
    return row;
  }

  function highlights(entries, showTournament = false) {

      for (const match of entry.games) {
        for (const mark of (match.result.highlights || []).filter(item => item.team === entry.team.id)) {
          const key = mark.kind + "/" + mark.subject;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push({entry,match,mark});

    }
    if (!groups.size) return [el("p","결과지에 기록된 수훈선수가 없습니다.","lb-empty")];
    return [...groups.values()].sort((a,b) => b.length - a.length).map((marks,i) => {
      const details = el("details",undefined,"lb-highlight");
      details.open = i === 0;
      const mark = marks[0].mark;

      const list = el("ul");
      for (const {entry,match,mark} of marks) {
        const result = match.result;
        const side = result.teams.indexOf(entry.team.id);
        const score = result.scores ? " " + result.scores[side] + "–" + result.scores[1-side] : "";
        const row = el("li");
        if (showTournament) row.append(el("div",entry.cup.tournament.name,"lb-muted"));
        row.append(el("div",shortDate(result.date || match.scheduledDate) + " · " + (match.group ? match.group + "조 · " : "") + match.stage + " · " + nameFor(entry.cup,result.teams[1-side]) + score,"lb-muted"));
        if (mark.record) row.append(el("div",mark.record));

  function record(entry) {

      body.replaceChildren(...(content.length ? content : [el("p","확인된 경기 결과가 없습니다.","lb-empty")]));

        ["games","경기 결과 · " + entry.games.length + "경기"]],initialTab,show),body);
    show(initialTab);

  function teamList(items, {query="", pageNumber=0, selected, choose, onSearch, onPage}) {
    const box = el("section",undefined,"lb-stack");
    const label = el("label","팀명 검색","lb-label");
    const search = el("input");
    search.type = "search";
    search.placeholder = "예: 인천미추홀드림";
    search.value = query;
    label.append(search);
    const rows = el("div");
    const listing = el("div",undefined,"lb-line lb-pager");
    const count = el("span",undefined,"lb-muted");
    count.setAttribute("aria-live","polite");
    const paging = el("div",undefined,"lb-buttons");
    const prev = button("이전",() => changePage(-1));
    const next = button("다음",() => changePage(1));
    paging.append(prev,next);
    listing.append(count,paging);

    function paint() {
      const normalize = value => value.normalize("NFC").toLocaleLowerCase("ko").replace(/\s+/g,"");
      const term = normalize(search.value);
      const matching = items.filter(item => [...(item.names || [item.name])].some(name => normalize(name).includes(term)));
      const pages = Math.max(1,Math.ceil(matching.length / 6));
      pageNumber = Math.min(pageNumber,pages-1);
      prev.disabled = pageNumber === 0;
      next.disabled = pageNumber >= pages-1;
      count.textContent = matching.length + "팀" + (pages > 1 ? " · " + (pageNumber+1) + " / " + pages + "쪽" : "");
      rows.replaceChildren(...matching.slice(pageNumber*6,(pageNumber+1)*6).map(item => {
        const entry = item.entry;
        const row = button(undefined,() => {
          selected = item.key;
          for (const other of rows.children) other.setAttribute("aria-pressed",String(other === row));
          choose(item.key);
        },"lb-team");
        row.setAttribute("aria-pressed",String(item.key === selected));
        const teamName = el("span",undefined,"lb-team-name");
        teamName.append(el("span",item.name));
        if (entry.key === favoriteTeamKey) teamName.append(el("span","관심팀","lb-favorite"));
        row.append(teamName);
        if (item.entries) {
          const year = Math.max(...[...item.entries,...item.scheduledEntries].map(record => record.cup.tournament.year));
          const recorded = item.entries.filter(record => record.cup.tournament.year === year).length;
          const scheduled = item.scheduledEntries.filter(record => record.cup.tournament.year === year).length;
          const labels = [year + "년"];
          if (recorded) labels.push("기록 " + recorded + "개 대회");
          if (scheduled) labels.push("예정 " + scheduled + "개 대회");
          row.append(el("small",labels.join(" · "),"lb-muted"));
        } else {
          row.append(el("span",placementLabel(entry),"lb-chip"),el("small",ageLabel(entry) + " · " + summary(entry.team),"lb-muted"));
        }
        return row;
      }));
      if (!matching.length) rows.append(el("p","검색 조건에 맞는 팀이 없습니다.","lb-empty"));
    }
    function changePage(amount) {
      pageNumber += amount;
      onPage?.(pageNumber);
      paint();
    }
    search.addEventListener("input",() => {
      pageNumber = 0;
      onSearch?.(search.value);
      onPage?.(0);
      paint();
    });
    box.append(label,rows,listing);
    paint();
    return box;
  }

      const tabs = controls("팀 기록 보기",[["records","시즌 기록"],["schedules",scheduleLabel]],state.teamTab,showTeamTab);

  function season(year, entries, yearLabel, openSchedule) {
    const section = el("section",undefined,"lb-year-summary");
    section.dataset.year = year;
    const header = el("div",undefined,"lb-season-header");
    const body = el("div",undefined,"lb-stack");
    header.append(el("h3",year + " 시즌 성적"),yearLabel,
      controls("팀 연령대",ageChoices,state.teamAge,showAge));
    section.append(header,body);
    showAge(state.teamAge);

    function showAge(age) {
      state.teamAge = age;
      const matching = entries.filter(entry => ageLabel(entry) === age);
      header.querySelector("h3").textContent = year + (matching.length ? " 시즌 성적" : " 시즌 기록");
      body.dataset.age = age;
      if (!matching.length) {
        const empty = el("div",undefined,"lb-empty");
        empty.append(el("p",year + "년 " + age + " 경기 결과가 아직 등록되지 않았습니다."));
        if (openSchedule) empty.append(button("대회 일정 보기",openSchedule,"lb-back"));
        body.replaceChildren(empty);
        saveRoute();
        return;
      }
      const totals = {wins:0,losses:0,draws:0,played:0,runsFor:0,runsAgainst:0};
      for (const entry of matching) {
        for (const key of Object.keys(totals)) totals[key] += entry.team[key];
      }
      const decided = totals.wins + totals.losses;
      const rate = decided ? (totals.wins / decided * 100).toFixed(1) + "%" : "—";
      const metrics = el("div",undefined,"lb-metrics");
      for (const [label,value] of [["경기",totals.played],["승",totals.wins],["패",totals.losses],
        ["무",totals.draws],["승률",rate],["참가 대회",matching.length]]) {
        const metric = el("div",undefined,"lb-metric");
        metric.append(el("small",label),el("strong",value));
        metrics.append(metric);
      }
      const note = el("p",undefined,"lb-season-note lb-muted");
      note.append(el("span",age + " · " + summary(totals)),el("span","득점 " + totals.runsFor + " / 실점 " + totals.runsAgainst));
      const list = el("div",undefined,"lb-age-tournaments");
      matching.forEach((entry,index) => {
        const item = el("details",undefined,"lb-entry");
        item.open = index === 0;
        const caption = el("summary");
        const meta = el("span",undefined,"lb-entry-meta");
        for (const [label,value] of [["최종 단계",placementLabel(entry)],["승패",summary(entry.team)]]) {
          const field = el("span");
          field.append(el("small",label),el("b",value));
          meta.append(field);
        }
        caption.append(el("strong",entry.cup.tournament.name),meta);
        item.append(caption,record(entry));
        list.append(item);
      });
      const content = el("div",undefined,"lb-season-content");
      const tabs = controls("시즌 기록",[["tournaments","대회별 기록"],["players","수훈선수 모아보기"]],state.seasonTab,showSeasonTab);
      body.replaceChildren(metrics,note,tabs,content);
      function showSeasonTab(tab) {
        state.seasonTab = tab;
        if (tab === "players") {
          content.replaceChildren(el("p","결과지에 수훈 기록이 있는 경기 기준입니다.","lb-muted"),...highlights(matching,true));
        } else content.replaceChildren(list);
        saveRoute();
      }
      showSeasonTab(state.seasonTab);
    }
    return section;
  }

  function renderCupDirectory() {
    const layout = el("section",undefined,"lb-stack");
    const results = el("div",undefined,"lb-stack");
    const tabs = controls("대회 연령대",ageChoices,state.cupAge,age => {
      state.cupAge = age;
      state.year = null;
      showCups();
    });
    layout.append(el("h2","대회 기록"),
      el("p","연령대와 시즌을 선택해 대회별 성적을 확인하세요.","lb-muted lb-cup-intro"),tabs,results);
    page.replaceChildren(layout);

    function showCups() {
      const available = cups.filter(cup => cup.tournament.ageGroup === state.cupAge);
      if (!available.length) {
        results.replaceChildren(el("p","등록된 " + state.cupAge + " 대회가 아직 없습니다.","lb-empty"));
        saveRoute();
        return;
      }
      const years = [...new Set(available.map(cup => cup.tournament.year))].sort((a,b) => b-a);
      if (!years.includes(state.year)) state.year = years[0];
      const yearControl = years.length === 1 ? el("h3",state.year + "년") :
        controls("대회 연도",years.map(year => [year,year + "년"]),state.year,year => {
          state.year = year;
          showCups();
        });
      const choices = available.filter(cup => cup.tournament.year === state.year).map(cup => {
        const card = button(undefined,() => {
          state.cupId = cup.tournament.id;
          state.cupTab = "standings";
          state.cupTeamId = null;
          state.cupGroup = "";
          state.cupRound = "";
          state.leagueGroup = "";
          renderCup(cup);
        },"lb-cup-button");
        card.append(el("span",cup.tournament.year + " · " + cup.tournament.ageGroup,"lb-chip"),
          el("strong",cup.tournament.name),el("small",cup.teams.length + "개 팀 참가 · " + cup.coverage.matched + "경기 결과","lb-muted"));
        return card;
      });
      const grid = el("div",undefined,"lb-cup-grid");
      grid.append(...choices);
      results.replaceChildren(yearControl,grid);
      saveRoute();
    }
    showCups();
  }

  function renderCup(cup) {
    const heading = el("div",undefined,"lb-cup-heading lb-line");
    const label = el("div");
    label.append(el("span",cup.tournament.ageGroup + " · " + cup.tournament.year,"lb-label"),el("h2",cup.tournament.name));
    heading.append(label,shareControl(),button("대회 목록",() => {
      state.cupId = null;
      renderCupDirectory();
    },"lb-back"));
    const panel = el("section",undefined,"lb-stack");
    const content = el("div");
    const views = [["standings","팀별 성적"],["rounds","경기 결과"]];
    if (cup.leagueStandings) views.push(["league","조별 순위"]);
    const switcher = controls("대회 상세",views,state.cupTab,tab => {
      state.cupTab = tab;
      showTab();
    });
    panel.append(heading,switcher);
    const groups = cup.tournament.groups || [];
    let groupControls;
    if (groups.length > 1) {
      const groupChoices = [["","전체 조"],...groups.map(group => [group,group + "조"])];
      groupControls = controls("대회 조",groupChoices,state.cupGroup,group => {
        state.cupGroup = group;
        showTab();
      });
      panel.append(groupControls);
    }
    panel.append(content);
    page.replaceChildren(panel);
    showTab();

    function showTab() {
      if (state.cupTab === "league") {
        const league = el("section",undefined,"lb-stack");
        const body = el("div");
        const rule = cup.leagueRules;
        const choices = Object.keys(cup.leagueStandings).map(group => [group,group + "조"]);
        const first = choices.some(([group]) => group === state.leagueGroup) ? state.leagueGroup : choices[0][0];
        league.append(el("h3","조별 예선 순위"),
          el("p","승 " + rule.win + "점 · 무 " + rule.draw + "점 · 패 " + rule.loss + "점 · 각 조 상위 " + rule.qualifiersPerGroup + "팀 16강 진출","lb-muted"),
          controls("예선 조",choices,first,showLeague),body);
        content.replaceChildren(league);
        showLeague(first);
        function showLeague(group) {
          state.leagueGroup = group;
          const table = el("table",undefined,"lb-league");
          table.setAttribute("aria-label",group + "조 예선 순위");
          const header = el("thead"), labels = el("tr");
          for (const label of ["순위","팀","전적","승점"]) {
            const cell = el("th",label);
            cell.scope = "col";
            labels.append(cell);
          }
          header.append(labels);
          const rows = el("tbody");
          for (const entry of cup.leagueStandings[group]) {
            const row = el("tr");
            row.append(el("td",entry.rank + "위"),el("td",nameFor(cup,entry.id)),
              el("td",summary(entry)),el("td",entry.points + "점"));
            rows.append(row);
          }
          table.append(header,rows);
          const scroll = el("div",undefined,"lb-table-scroll");
          scroll.append(table);
          body.replaceChildren(scroll);
          saveRoute();
        }
        return;
      }
      if (state.cupTab === "rounds") {
        const rounds = [...new Set(cup.matches.map(match => match.stage))].reverse();
        const picker = el("select");
        const label = el("label","라운드 ","lb-label");
        const results = el("div");
        for (const stage of rounds) picker.append(el("option",stage));
        if (rounds.includes(state.cupRound)) picker.value = state.cupRound;
        picker.addEventListener("change",showRound);
        label.append(picker);
        content.replaceChildren(label,results);
        showRound();
        function showRound() {
          state.cupRound = picker.value;
          results.replaceChildren(...cup.matches.filter(match =>
            match.stage === picker.value && (!state.cupGroup || match.group === state.cupGroup)
          ).map(match => resultRow(cup,match)));
          saveRoute();
        }
        return;
      }
      const standings = cup.teams.filter(team => !state.cupGroup || cup.groupByTeam?.[team.id] === state.cupGroup)
        .sort((a,b) => Number(b.entry.key === favoriteTeamKey) - Number(a.entry.key === favoriteTeamKey) ||
          nameFor(cup,a.id).localeCompare(nameFor(cup,b.id),"ko"));
      if (!standings.some(team => team.id === state.cupTeamId)) state.cupTeamId = standings[0]?.id;
      const layout = el("div",undefined,"lb-columns lb-team-layout");
      const detail = el("section",undefined,"lb-panel lb-stack");
      detail.id = "lb-cup-team-detail";
      const list = teamList(standings.map(team => ({key:team.id,name:nameFor(cup,team.id),entry:team.entry})), {
        pageNumber:Math.max(0,Math.floor(standings.findIndex(team => team.id === state.cupTeamId) / 6)),
        selected:state.cupTeamId,choose:id => {
          state.cupTeamId = id;
          if (mobileLayout.matches) searchPanel.open = false;
          showEntry();
          saveRoute();
          focusMobileDetail(detail);
        }
      });
      const searchPanel = teamSearchPanel(list);
      layout.append(searchPanel,detail);
      if (mobileLayout.matches) layout.prepend(detail);
      content.replaceChildren(layout);
      showEntry();
      function showEntry() {
        const entry = cup.teamsById.get(state.cupTeamId)?.entry;
        if (!entry) {
          detail.replaceChildren(el("p","등록된 참가팀이 없습니다.","lb-empty"));
          return;
        }
        const heading = el("div",undefined,"lb-line");
        const teamName = el("h3",nameFor(cup,entry.team.id));
        teamName.tabIndex = -1;
        heading.append(teamName,el("span",placementLabel(entry),"lb-chip"),button("팀 검색",() => openTeamSearch(searchPanel),"lb-back lb-team-back"));
        detail.replaceChildren(heading,record(entry));
      }
      saveRoute();
    }
  }

  function renderView() {
    for (const item of root.querySelectorAll("[data-view]")) item.setAttribute("aria-pressed",String(item.dataset.view === state.view));
    if (state.view === "teams") renderTeams();
    else if (state.cupId) renderCup(cups.find(cup => cup.tournament.id === state.cupId));
    else renderCupDirectory();
  }

  let restoringRoute = false;
  let lastRoute = location.hash;
  function saveRoute(replace = false) {
    if (restoringRoute) return;
    const params = new URLSearchParams();
    params.set("view",state.view);
    if (state.view === "teams") {
      params.set("team",state.teamKey || "");
      if (state.teamYear) params.set("year",state.teamYear);
      params.set("age",state.teamAge);
      if (state.teamTab === "schedules") params.set("tab","schedules");
      if (state.seasonTab !== "tournaments") params.set("section",state.seasonTab);
      if (state.scheduleOrder === "age") params.set("scheduleOrder","age");
      if (state.teamQuery) params.set("q",state.teamQuery);
      if (state.teamPage) params.set("page",state.teamPage);
    } else {
      params.set("age",state.cupAge);
      if (state.year) params.set("year",state.year);
      if (state.cupId) {
        params.set("cup",state.cupId);
        params.set("tab",state.cupTab);
        if (state.cupGroup) params.set("group",state.cupGroup);
        if (state.cupTab === "standings" && state.cupTeamId) params.set("team",state.cupTeamId);
        if (state.cupTab === "rounds" && state.cupRound) params.set("round",state.cupRound);
        if (state.cupTab === "league" && state.leagueGroup) params.set("league",state.leagueGroup);
      }
    }
    const nextRoute = "#" + params.toString();
    if (location.hash === nextRoute) return;
    history[replace ? "replaceState" : "pushState"](null,"",nextRoute);
    lastRoute = location.hash;
  }

  function restoreRoute() {
    const params = new URLSearchParams(location.hash.slice(1));
    state.view = params.get("view") === "cups" ? "cups" : "teams";
    const age = ages.includes(params.get("age")) ? params.get("age") : ages[0];
    const year = Number(params.get("year"));
    if (state.view === "teams") {
      state.teamKey = teamIndex.has(params.get("team")) ? params.get("team") : teams[0]?.key;
      state.teamYear = year || null;
      state.teamAge = age;
      state.teamTab = params.get("tab") === "schedules" || params.get("section") === "schedules" ? "schedules" : "records";
      state.seasonTab = params.get("section") === "players" ? "players" : "tournaments";
      state.scheduleOrder = params.get("scheduleOrder") === "age" ? "age" : "date";
      state.teamQuery = params.get("q") || "";
      const pageNumber = Number(params.get("page"));
      state.teamPage = Number.isSafeInteger(pageNumber) && pageNumber > 0 ? pageNumber : 0;
    } else {
      const cup = cups.find(cup => cup.tournament.id === params.get("cup"));
      state.cupId = cup?.tournament.id || null;
      state.cupAge = cup?.tournament.ageGroup || age;
      state.year = cup?.tournament.year || year || null;
      const tabs = cup?.leagueStandings ? ["standings","rounds","league"] : ["standings","rounds"];
      state.cupTab = tabs.includes(params.get("tab")) ? params.get("tab") : "standings";
      state.cupTeamId = cup?.teamsById.has(params.get("team")) ? params.get("team") : null;
      state.cupGroup = cup?.tournament.groups?.includes(params.get("group")) ? params.get("group") : "";
      state.cupRound = params.get("round") || "";
      state.leagueGroup = params.get("league") || "";
    }
    restoringRoute = true;
    renderView();
    restoringRoute = false;
    saveRoute(true);
  }

  for (const home of root.querySelectorAll("[data-home]")) {
    home.addEventListener("click",event => {
      if (home.tagName === "A" && (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)) return;
      event.preventDefault();
      Object.assign(state,initialState);
      renderView();
      page.querySelector("#lb-team-detail h2")?.focus({preventScroll:true});
      window.scrollTo(0,0);
    });
  }
  for (const tab of root.querySelectorAll("[data-view]")) {
    tab.addEventListener("click",() => {
      state.view = tab.dataset.view;
      renderView();
    });
  }
  for (const event of ["popstate","hashchange"]) {
    window.addEventListener(event,() => {
      if (location.hash === lastRoute) return;
      lastRoute = location.hash;
      restoreRoute();
    });
  }
  mobileLayout.addEventListener("change",() => {
    for (const panel of root.querySelectorAll(".lb-team-search")) {
      const active = document.activeElement;
      const searchFocused = panel.contains(active);
      const layout = panel.parentElement;
      layout.prepend(mobileLayout.matches ? layout.querySelector(":scope > .lb-panel") : panel);
      panel.open = !mobileLayout.matches || searchFocused;
      if (layout.contains(active)) active.focus({preventScroll:true});
    }
  });
  restoreRoute();
})();
</script>

</body>
</html>
